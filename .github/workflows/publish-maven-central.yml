name: Publish to Maven Central

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*-RC*'
  workflow_dispatch:
    inputs:
      version:
        description: Maven release candidate version to publish, for example 26.2-RC1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.verify-version.outputs.version }}

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up GraalVM 25 and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Verify build JDK and target release
        run: |
          java --version
          java_vendor_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.vendor.version = //p')"
          [[ "$java_vendor_version" == "Oracle GraalVM 25."* ]]
          test "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')" = "25"
          test "$(./mvnw --quiet help:evaluate -Dexpression=maven.compiler.release -DforceStdout)" = "21"

      - name: Verify release version
        id: verify-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          project_version="$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          release_version="${RELEASE_VERSION#v}"

          if [[ "$project_version" != "$release_version" ]]; then
            echo "Requested version $release_version does not match Maven project version $project_version" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_TYPE" != "branch" || "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              echo "Release candidates must be published manually from a non-default branch" >&2
              exit 1
            fi

            if [[ ! "$project_version" =~ ^[0-9]+(\.[0-9]+){1,2}-RC[1-9][0-9]*$ ]]; then
              echo "Manual publications require an RC version such as 26.2-RC1: $project_version" >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$REF_TYPE" != "tag" ]]; then
              echo "RC tag publications require a tag ref: $REF_TYPE" >&2
              exit 1
            fi

            if [[ ! "$project_version" =~ ^[0-9]+(\.[0-9]+){1,2}-RC[1-9][0-9]*$ ]]; then
              echo "RC tags require a Maven version such as 26.2-RC1: $project_version" >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "release" ]]; then
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              echo "GitHub prereleases cannot publish stable Maven artifacts" >&2
              exit 1
            fi

            if [[ ! "$project_version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "GitHub Releases require a stable Maven version such as 26.2: $project_version" >&2
              exit 1
            fi
          else
            echo "Unsupported publication event: $EVENT_NAME" >&2
            exit 1
          fi

          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Prelease
          -DexcludedGroups=runtime-e2e
          -Dgpg.signer=bc
          clean deploy

  prepare-jdbc-driver:
    name: Prepare JDBC driver ${{ needs.publish.outputs.version }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download the published JDBC driver
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          asset_dir="$RUNNER_TEMP/kubling-driver"
          driver_name="kubling-${VERSION}-jdbc.jar"
          central_url="https://repo1.maven.org/maven2/com/kubling/kubling/${VERSION}"

          mkdir -p "$asset_dir"

          for asset_name in "$driver_name" "$driver_name.asc"; do
            curl --fail --silent --show-error --location \
              --connect-timeout 20 \
              --retry 60 --retry-all-errors --retry-delay 10 --retry-max-time 600 \
              --output "$asset_dir/$asset_name" \
              "$central_url/$asset_name"
          done

      - name: Verify the JDBC driver
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          asset_dir="$RUNNER_TEMP/kubling-driver"
          driver_name="kubling-${VERSION}-jdbc.jar"
          driver_path="$asset_dir/$driver_name"
          expected_driver="com.kubling.jdbc.KublingDriver"
          expected_class="com/kubling/jdbc/KublingDriver.class"

          test -s "$driver_path"
          test -s "$driver_path.asc"

          driver_service="$(
            unzip -p "$driver_path" META-INF/services/java.sql.Driver \
              | tr -d '\r' \
              | sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d'
          )"
          driver_class="$(unzip -Z1 "$driver_path" "$expected_class" 2>/dev/null || true)"

          if [[ "$driver_service" != "$expected_driver" ]]; then
            echo "Unexpected JDBC service provider: $driver_service" >&2
            exit 1
          fi

          if [[ "$driver_class" != "$expected_class" ]]; then
            echo "JDBC driver class is missing from $driver_name" >&2
            exit 1
          fi

          (
            cd "$asset_dir"
            sha256sum "$driver_name" > "$driver_name.sha256"
          )

      - name: Preserve JDBC driver from this publication
        uses: actions/upload-artifact@v7
        with:
          name: kubling-${{ needs.publish.outputs.version }}-jdbc
          path: |
            ${{ runner.temp }}/kubling-driver/kubling-${{ needs.publish.outputs.version }}-jdbc.jar
            ${{ runner.temp }}/kubling-driver/kubling-${{ needs.publish.outputs.version }}-jdbc.jar.asc
            ${{ runner.temp }}/kubling-driver/kubling-${{ needs.publish.outputs.version }}-jdbc.jar.sha256
          if-no-files-found: error
          retention-days: 30

  attach-jdbc-driver:
    name: Attach JDBC driver to ${{ github.event.release.tag_name }}
    if: ${{ github.event_name == 'release' }}
    needs:
      - publish
      - prepare-jdbc-driver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the prepared JDBC driver
        uses: actions/download-artifact@v8
        with:
          name: kubling-${{ needs.publish.outputs.version }}-jdbc
          path: ${{ runner.temp }}/kubling-driver

      - name: Attach JDBC driver to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          asset_dir="$RUNNER_TEMP/kubling-driver"

          for asset_path in "$asset_dir"/*; do
            asset_name="$(basename "$asset_path")"
            local_digest="sha256:$(sha256sum "$asset_path" | cut -d ' ' -f 1)"
            remote_digest="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq ".assets[] | select(.name == \"$asset_name\") | .digest"
            )"

            if [[ -z "$remote_digest" ]]; then
              gh release upload "$RELEASE_TAG" "$asset_path" --repo "$GITHUB_REPOSITORY"
            elif [[ "$remote_digest" == "$local_digest" ]]; then
              echo "$asset_name is already attached with the expected digest"
            else
              echo "Refusing to replace $asset_name: the existing asset has a different digest" >&2
              exit 1
            fi
          done
