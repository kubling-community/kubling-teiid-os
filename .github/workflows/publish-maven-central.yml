name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish, for example 26.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          project_version="$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          release_version="${RELEASE_VERSION#v}"

          if [[ "$project_version" == *-SNAPSHOT ]]; then
            echo "Snapshot versions cannot be published as Maven Central releases: $project_version" >&2
            exit 1
          fi

          if [[ "$project_version" != "$release_version" ]]; then
            echo "Release version $release_version does not match Maven project version $project_version" >&2
            exit 1
          fi

      - name: Build, sign, and publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Prelease
          -Dgpg.signer=bc
          clean deploy
